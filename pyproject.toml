[project]
name = "matrix-square-root"
version = "0.1.0"
description = "Computes the principal matrix square root via the Denman-Beavers iteration for small dense matrices."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
